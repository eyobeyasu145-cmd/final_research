<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f12;
      --surface: #1a1a22;
      --text: #e8e8ed;
      --muted: #8b8b9a;
      --accent: #6c8cff;
      --accent-hover: #8aa4ff;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
    }

    main {
      text-align: center;
      padding: 2rem;
      max-width: 32rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      margin-bottom: 2rem;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: background 0.2s ease;
    }

    a:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world</h1>
    <p>Your page is ready. Edit <code>index.html</code> to get started.</p>
    <a href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank" rel="noopener noreferrer">Learn HTML</a>
  </main>
</body>
</html>
